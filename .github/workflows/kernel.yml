name: fajita-kernel

# Builds the patched XNU for the OnePlus 6T (fajita) on a macOS runner and
# uploads kernel.macho + the ADT sidecar. The Linux host then builds payload.img
# and flashes it to system_a.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel.yml'
      - 'configs/**'
      - 'dts/**'
      - 'patches/**'
      - 'board.toml'
      - 'feeds.toml'

jobs:
  kernel:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      UNIXNU_IPSW: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
      XNU_OWNER_ROOT_VOLUME_UUID: 04769D26-2CA0-4825-B443-E2E5F88300F2
      UNIXNU_UNIQUE_CHIP_ID: "0badc0de"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Install host tools
        run: |
          brew install cmake ninja llvm lld mtools dtc unifdef jq python@3.12
          brew install blacktop/tap/ipsw || true
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"
          python3 --version
          python3 -m pip install --break-system-packages -q pyyaml tomli || true
          xcodebuild -version

      - name: Clone UniXNU
        run: |
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git unixnu
          cd unixnu
          # drivers/AppleKeyStoreState pins a commit the upstream repository no longer serves
          git config -f .gitmodules --remove-section submodule.drivers/AppleKeyStoreState || true
          git submodule update --init --depth 1 --recursive || true
          for m in kits/XnuPrelink drivers/ArmCpu drivers/ArmDTPlatform drivers/DarwinBoot kits/VerifiedRoot; do
            test -e "$m/." || { echo "missing submodule $m"; exit 1; }
          done

      - name: Merge generic XNU patch series
        run: |
          cp -n unixnu/patches/xnu/*.patch device/patches/xnu/ || true
          rm -f device/patches/xnu/zzz-pmap-reserved10.patch
          echo "patch count: $(ls device/patches/xnu | wc -l)"

      - name: Select configuration
        run: |
          cd unixnu
          ./unixnu defconfig fajita_defconfig -D "$GITHUB_WORKSPACE/device"
          ./unixnu status --json > "$GITHUB_WORKSPACE/status.json" || true

      - name: Fetch sources and IPSW
        run: |
          cd unixnu
          ./unixnu fetch

      - name: Harden header fetch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("unixnu/scripts/prepare-xnu-source.py")
          src = p.read_text()
          start = src.index("def fetch(url):")
          end = src.index("def restore(")
          new = """def fetch(url):
              import time
              last = None
              for attempt in range(5):
                  request = urllib.request.Request(url, headers={'User-Agent': 'unixnu-prepare-xnu-source'})
                  if TOKEN and urllib.parse.urlsplit(url).hostname in ('api.github.com', 'raw.githubusercontent.com'):
                      request.add_header('Authorization', f'Bearer {TOKEN}')
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          return response.read()
                  except Exception as exc:
                      last = exc
                      time.sleep(5 * (attempt + 1))
              raise last


          """
          p.write_text(src[:start] + new + src[end:])
          print("prepare-xnu-source.py hardened")
          PY

      - name: Clone Mu-Silicium
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/Project-Silicium/Mu-Silicium.git uefi
          echo "UNIXNU_UEFI=$GITHUB_WORKSPACE/uefi" >> "$GITHUB_ENV"
          find uefi -name 'Font.h' | head -3

      - name: Stage boot-progress stub
        run: |
          cd unixnu
          ./unixnu tree
          mkdir -p out/fajita/tree/build/boot-progress-stub
          cat > out/fajita/tree/build/boot-progress-stub/stub.c <<'EOF'
          void boot_progress_cpu_tail(void) {}
          void boot_progress_cpu_head(void) {}
          EOF
          xcrun -sdk iphoneos clang -arch arm64 -c out/fajita/tree/build/boot-progress-stub/stub.c             -o out/fajita/tree/build/boot-progress-stub/stub.o
          xcrun ar rcs out/fajita/tree/build/boot-progress-stub/libBootProgressStub.a             out/fajita/tree/build/boot-progress-stub/stub.o
          ls -l out/fajita/tree/build/boot-progress-stub

      - name: Build kernel and ADT
        run: |
          set -x
          cd unixnu
          ./unixnu build kernel || true
          python3 "$GITHUB_WORKSPACE/device/scripts/make-fajita-adt.py" \
            --dram-size 0x200000000 --chip-id 0x8011 --unique-chip-id 0badc0de \
            --root-match-volume-uuid 04769D26-2CA0-4825-B443-E2E5F88300F2 \
            --output out/fajita/kernel/kernel.macho.adt
          ls -l out/fajita/kernel/

      - name: Build console payload
        run: |
          set -x
          cp -r device device-console
          python3 device-console/scripts/trim-payload-args.py device-console/board.toml
          cd unixnu
          ./unixnu defconfig fajita_defconfig -D "$GITHUB_WORKSPACE/device-console"
          ./unixnu build payload -D "$GITHUB_WORKSPACE/device-console" --unique-chip-id 0badc0de
          ls -l out/fajita/payload/ || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find unixnu/out -name 'kernel.macho*' -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \; || true
          find unixnu/out -path '*logs*' -name '*.log' -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \; || true
          ls -l "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fajita-kernel
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload status and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fajita-logs
          path: |
            status.json
            unixnu/out/fajita/logs/**
          if-no-files-found: ignore
          retention-days: 7
